envVarGroups:
  - name: kayou-supabase-shared
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

databases:
  - name: kayou-db-dev
    plan: basic-256mb
    region: frankfurt
  - name: kayou-db-prod
    plan: basic-1gb
    region: frankfurt

services:
  - type: web
    name: kayou-backend-dev
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@kayu/backend
    preDeployCommand: pnpm --filter @kayu/backend exec prisma migrate deploy
    startCommand: node apps/backend/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - fromGroup: kayou-supabase-shared
      - key: NODE_ENV
        value: production
      - key: STORAGE_ENV_PREFIX
        value: dev
      - key: SEED_SUPABASE_USERS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kayou-db-dev
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: "10000"

  - type: web
    name: kayou-web-dev
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@kayu/web
    startCommand: pnpm --filter @kayu/web start
    healthCheckPath: /
    envVars:
      - fromGroup: kayou-supabase-shared
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: kayou-backend-dev
          property: hostport
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  - type: web
    name: kayou-backend-prod
    runtime: node
    region: frankfurt
    plan: standard
    branch: main
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@kayu/backend
    preDeployCommand: pnpm --filter @kayu/backend exec prisma migrate deploy
    startCommand: node apps/backend/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - fromGroup: kayou-supabase-shared
      - key: NODE_ENV
        value: production
      - key: STORAGE_ENV_PREFIX
        value: prod
      - key: SEED_SUPABASE_USERS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kayou-db-prod
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: "10000"

  - type: web
    name: kayou-web-prod
    runtime: node
    region: frankfurt
    plan: standard
    branch: main
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@kayu/web
    startCommand: pnpm --filter @kayu/web start
    healthCheckPath: /
    envVars:
      - fromGroup: kayou-supabase-shared
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: kayou-backend-prod
          property: hostport
      - key: NEXT_PUBLIC_APP_URL
        sync: false
