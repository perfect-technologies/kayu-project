<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>KAYOU — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
<style>
  /* Prototype shell styling */
  body { background: #F5F5F4; }
  .shell {
    min-height: 100vh;
    padding: 28px 28px 100px;
    display: grid;
    grid-template-columns: minmax(920px, 1.6fr) minmax(420px, 0.8fr);
    gap: 32px;
    align-items: start;
  }
  .shell-header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px; padding: 0 4px 4px;
  }
  .frame-label {
    font-family: var(--k-font-mono); font-size: 11px; font-weight: 500;
    color: #57534E; letter-spacing: 0.06em; text-transform: uppercase;
    margin: 0 0 10px 4px; display: flex; align-items: center; gap: 10px;
  }
  .frame-label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--k-primary); }

  .web-frame {
    border-radius: 18px; overflow: hidden;
    background: var(--k-bg);
    border: 1px solid #D6D3D1;
    box-shadow: 0 20px 60px rgba(15,23,42,0.08), 0 4px 12px rgba(15,23,42,0.04);
    height: calc(100vh - 120px);
    min-height: 780px;
    display: flex; flex-direction: column;
  }
  .web-chrome {
    height: 36px; background: #F5F5F4; border-bottom: 1px solid #E7E5E4;
    display: flex; align-items: center; padding: 0 14px; gap: 12px;
    flex-shrink: 0;
  }
  .web-chrome .dots { display: flex; gap: 6px; }
  .web-chrome .dots span { width: 10px; height: 10px; border-radius: 50%; }
  .web-chrome .url { flex: 1; height: 22px; background: white; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font: 400 11px/1 var(--k-font-mono); color: #78716C; }
  .web-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

  .mobile-wrap { display: flex; flex-direction: column; align-items: center; position: sticky; top: 24px; }
  .mobile-frame {
    width: 390px; height: 820px;
    border-radius: 48px;
    background: #1C1917;
    padding: 12px;
    box-shadow: 0 30px 60px rgba(15,23,42,0.15), 0 0 0 1px #44403C;
    position: relative;
  }
  .mobile-screen {
    width: 100%; height: 100%;
    border-radius: 38px; overflow: hidden;
    background: var(--k-bg);
    position: relative;
  }
  .mobile-screen::before {
    content: "";
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; border-radius: 20px;
    background: #0C0A09; z-index: 100;
  }
  .mobile-status {
    position: absolute; top: 0; left: 0; right: 0;
    height: 48px; padding: 16px 30px 0;
    display: flex; justify-content: space-between; align-items: center;
    font-family: -apple-system, "SF Pro Display", system-ui;
    font-weight: 600; font-size: 14px; color: var(--k-text-primary);
    z-index: 90; pointer-events: none;
  }
  .mobile-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-top: 48px; }

  /* Tabs bar on prototype */
  .proto-tabs {
    display: flex; gap: 4px; background: white;
    border: 1px solid #D6D3D1; border-radius: 999px; padding: 4px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.04);
  }
  .proto-tab {
    padding: 8px 16px; border-radius: 999px; border: 0; background: transparent;
    font: 500 13px/1 var(--k-font-body); color: #57534E; cursor: pointer;
  }
  .proto-tab.active { background: #1C1917; color: white; }

  .brand-badge {
    display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px;
    background: white; border: 1px solid #D6D3D1; border-radius: 999px;
    font-family: var(--k-font-display); font-weight: 700; letter-spacing: -0.01em;
  }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; right: 20px; bottom: 20px;
    background: white; border: 1px solid #D6D3D1;
    border-radius: 16px; padding: 18px;
    width: 260px; box-shadow: 0 20px 40px rgba(15,23,42,0.12);
    font-family: var(--k-font-body); z-index: 200;
  }
  .tweaks-panel h4 { font-family: var(--k-font-display); font-size: 14px; margin: 0 0 14px; }
  .tweaks-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-size: 13px; }

  @media (max-width: 1400px) {
    .shell { grid-template-columns: 1fr; }
    .mobile-wrap { position: static; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="shell-header">
    <div class="brand-badge">
      <svg width="24" height="24" viewBox="0 0 32 32"><path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" fill="#0EA5E9"/><path d="M11 10 v12 M11 16 L19 10 M11 16 L19 22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span style="font-size:15px">KAYOU</span>
      <span class="k-chip k-chip-sm k-chip-primary" style="margin-left:4px">Prototype</span>
    </div>
    <div id="proto-tabs" class="proto-tabs"></div>
    <div style="flex:1"></div>
    <div style="font: 500 12px/1 var(--k-font-mono); color: #78716C;" id="trail">—</div>
  </div>

  <div>
    <div class="frame-label"><span class="dot"></span>Web · 1280px</div>
    <div class="web-frame">
      <div class="web-chrome">
        <div class="dots"><span style="background:#FCA5A5"></span><span style="background:#FCD34D"></span><span style="background:#86EFAC"></span></div>
        <div class="url">kayou.cd<span id="web-url-path" style="color:#A8A29E">/</span></div>
      </div>
      <div id="web-root" class="web-scroll k-scroll"></div>
    </div>
  </div>

  <div class="mobile-wrap">
    <div class="frame-label"><span class="dot"></span>Mobile · 390px</div>
    <div class="mobile-frame">
      <div class="mobile-screen">
        <div class="mobile-status">
          <span>9:41</span>
          <span style="display:flex; gap:6px; align-items:center">
            <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="6" width="2.5" height="4" rx="0.5" fill="currentColor"/><rect x="4" y="4" width="2.5" height="6" rx="0.5" fill="currentColor"/><rect x="8" y="2" width="2.5" height="8" rx="0.5" fill="currentColor"/><rect x="12" y="0" width="2.5" height="10" rx="0.5" fill="currentColor"/></svg>
            <svg width="22" height="10" viewBox="0 0 22 10"><rect x="0.5" y="0.5" width="18" height="9" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="15" height="6" rx="1.5" fill="currentColor"/><rect x="20" y="3.5" width="1.5" height="3" rx="0.5" fill="currentColor"/></svg>
          </span>
        </div>
        <div id="mobile-root" class="mobile-scroll k-scroll"></div>
      </div>
    </div>
  </div>
</div>

<div class="tweaks-panel" id="tweaks" style="display:none">
  <h4>Tweaks</h4>
  <div class="tweaks-row">
    <label>Vue mobile uniquement</label>
    <input type="checkbox" id="tw-mobile-only"/>
  </div>
  <div class="tweaks-row">
    <label>Densité compacte</label>
    <input type="checkbox" id="tw-compact"/>
  </div>
  <div class="tweaks-row">
    <label>Kayou Moment ralenti</label>
    <input type="checkbox" id="tw-km-slow"/>
  </div>
  <div class="tweaks-row" style="margin-top:14px">
    <label style="font-size:12px; color:#78716C">Accent hue</label>
  </div>
  <input type="range" id="tw-hue" min="0" max="360" value="350" style="width:100%; accent-color: var(--k-accent)"/>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="components/MobileShell.jsx"></script>
<script type="text/babel" src="components/Homepage.jsx"></script>
<script type="text/babel" src="components/SearchPage.jsx"></script>
<script type="text/babel" src="components/ProviderProfile.jsx"></script>
<script type="text/babel" src="components/BookingFlow.jsx"></script>
<script type="text/babel" src="components/BookingDetail.jsx"></script>
<script type="text/babel" src="components/AdminOps.jsx"></script>
<script type="text/babel" src="components/ProVerification.jsx"></script>
<script type="text/babel" src="components/WriteReview.jsx"></script>
<script type="text/babel" src="components/Messages.jsx"></script>
<script type="text/babel" src="components/ProviderDashboard.jsx"></script>
<script type="text/babel" src="components/ProviderOnboarding.jsx"></script>
<script type="text/babel" src="components/MyBookings.jsx"></script>
<script type="text/babel" src="components/JobRequests.jsx"></script>
<script type="text/babel" src="components/QuoteCompose.jsx"></script>
<script type="text/babel" src="components/Earnings.jsx"></script>
<script type="text/babel" src="components/Auth.jsx"></script>

<script type="text/babel">
// Prototype orchestrator — shared screen state drives both web & mobile roots
const SCREENS = [
  { id: "auth",     label: "Connexion",      url: "/auth", group: "shared" },
  { id: "home",     label: "Accueil",        url: "/", group: "client" },
  { id: "search",   label: "Recherche",      url: "/pros?q=plombier", group: "client" },
  { id: "profile",  label: "Profil pro",     url: "/pros/jean-mubake", group: "client" },
  { id: "booking",  label: "Réservation",    url: "/book/jean-mubake", group: "client" },
  { id: "bookings", label: "Mes résas",      url: "/bookings", group: "client" },
  { id: "messages", label: "Messages",       url: "/messages", group: "client" },
  { id: "review",   label: "Avis",           url: "/review/jean-mubake", group: "client" },
  { id: "provider", label: "Dashboard pro",  url: "/pro", group: "pro" },
  { id: "requests", label: "Demandes pro",   url: "/pro/requests", group: "pro" },
  { id: "quote",    label: "Devis",          url: "/pro/devis/new", group: "pro" },
  { id: "earnings", label: "Gains",          url: "/pro/earnings", group: "pro" },
  { id: "onboarding", label: "Devenir pro",  url: "/pro/onboarding", group: "pro" },
  { id: "verify",   label: "Vérification",   url: "/pro/verify", group: "pro" },
  { id: "admin",    label: "Ops admin",      url: "/admin", group: "admin" },
];

function App({ mobile }) {
  const [[screen, param], setRoute] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("kayou:route") || "null");
      if (saved && SCREENS.some(s => s.id === saved[0])) return saved;
    } catch(e) {}
    return ["home", null];
  });

  React.useEffect(() => {
    localStorage.setItem("kayou:route", JSON.stringify([screen, param]));
    // publish route for chrome
    window.dispatchEvent(new CustomEvent("kayou:route", { detail: [screen, param] }));
  }, [screen, param]);

  // Listen for top-level tab changes
  React.useEffect(() => {
    const handler = (e) => setRoute([e.detail, null]);
    window.addEventListener("kayou:nav", handler);
    return () => window.removeEventListener("kayou:nav", handler);
  }, []);

  const nav = (s, p) => setRoute([s, p || null]);

  const body = (() => {
    if (screen === "home") return <Homepage nav={nav} mobile={mobile}/>;
    if (screen === "search") return <SearchPage nav={nav} mobile={mobile}/>;
    if (screen === "profile") return <ProviderProfile nav={nav} mobile={mobile} providerId={param} onBook={() => nav("booking", param)}/>;
    if (screen === "booking") return <BookingFlow nav={nav} mobile={mobile} providerId={param} onDone={() => nav("review", param)}/>;
    if (screen === "messages") return <Messages nav={nav} mobile={mobile}/>;
    if (screen === "review") return <WriteReview nav={nav} mobile={mobile} providerId={param}/>;
    if (screen === "provider") return <ProviderDashboard nav={nav} mobile={mobile}/>;
    if (screen === "onboarding") return <ProviderOnboarding nav={nav} mobile={mobile}/>;
    if (screen === "bookings") return <MyBookings nav={nav} mobile={mobile}/>;
    if (screen === "requests") return <JobRequests nav={nav} mobile={mobile}/>;
    if (screen === "quote") return <QuoteCompose nav={nav} mobile={mobile} requestId={param}/>;
    if (screen === "detail") return <BookingDetail nav={nav} mobile={mobile} bookingId={param}/>;
    if (screen === "admin") return <AdminOps nav={nav} mobile={mobile}/>;
    if (screen === "verify") return <ProVerification nav={nav} mobile={mobile}/>;
    if (screen === "earnings") return <Earnings nav={nav} mobile={mobile}/>;
    if (screen === "auth") return <Auth nav={nav} mobile={mobile}/>;
    return null;
  })();

  if (mobile) {
    return (
      <div style={{ position: "relative", height: "100%", overflow: "hidden" }}>
        <div style={{ position: "absolute", inset: 0, overflowY: "auto" }} className="k-scroll">
          {body}
        </div>
        {!["booking", "profile", "review", "onboarding", "auth", "quote"].includes(screen) && <MobileTabBar activeScreen={screen} nav={nav}/>}
      </div>
    );
  }

  return body;
}

// Tabs
const tabsEl = document.getElementById("proto-tabs");
function renderTabs(active) {
  tabsEl.innerHTML = "";
  SCREENS.forEach(s => {
    const b = document.createElement("button");
    b.className = "proto-tab" + (active === s.id ? " active" : "");
    b.textContent = s.label;
    b.onclick = () => window.dispatchEvent(new CustomEvent("kayou:nav", { detail: s.id }));
    tabsEl.appendChild(b);
  });
}
window.addEventListener("kayou:route", e => {
  const [screen, param] = e.detail;
  renderTabs(screen);
  const s = SCREENS.find(x => x.id === screen);
  const url = (s?.url || "/") + (param ? (screen === "profile" ? `/${param}` : "") : "");
  document.getElementById("web-url-path").textContent = url;
  const trail = SCREENS.find(x => x.id === screen)?.label;
  document.getElementById("trail").textContent = trail ? `→ ${trail}` : "";
});
renderTabs("home");

ReactDOM.createRoot(document.getElementById("web-root")).render(<App mobile={false}/>);
ReactDOM.createRoot(document.getElementById("mobile-root")).render(<App mobile={true}/>);
</script>

</body>
</html>
