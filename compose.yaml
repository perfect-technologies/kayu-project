services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kayu
    ports:
      - "5433:5432"
    volumes:
      - kayu-postgres-data:/var/lib/postgresql/data

volumes:
  kayu-postgres-data:
